<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Rasmi Surau Al Falah Taman Seri Chinchin</title>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useState } = React;
        
        const supabaseUrl = '';
        const supabaseAnonKey = '';
        const supabase = (supabaseUrl && supabaseAnonKey && window.supabase) 
            ? window.supabase.createClient(supabaseUrl, supabaseAnonKey) 
            : null;

        function App() {
          const [activeTab, setActiveTab] = useState('aktiviti')
          const [subAktivitiTab, setSubAktivitiTab] = useState('Mingguan')
          
          const [dataSurau, setDataSurau] = useState([
            { id: 1, tarikh: 'Setiap Malam Jumaat', kategori: 'Mingguan', perkara: 'Majlis Bacaan Yassin & Tahlil', status: 'Aktif' },
            { id: 2, tarikh: 'Setiap Sabtu', kategori: 'Mingguan', perkara: 'Kelas Al-Quran Kariah', status: 'Aktif' },
            { id: 3, tarikh: 'Minggu pertama setiap bulan', kategori: 'Bulanan', perkara: 'Mesyuarat AJK Surau & Khairat', status: 'Aktif' },
            { id: 4, tarikh: '12/2/2026', kategori: 'Tahunan', perkara: 'Program Tahlil Perdana & Ceramah Israk Mikraj', status: 'Aktif' },
            { id: 5, tarikh: 'Bulan Ramadhan', kategori: 'Tahunan', perkara: 'Program Ihya Ramadhan, Jamuan Bubur Lambuk & Berbuka Puasa', status: 'Aktif' }
          ])

          const [dataPembangunan, setDataPembangunan] = useState([
            { id: 1, projek: 'Naik Taraf Sistem Siar Raya (PA System)', status: 'Dalam Perancangan' },
            { id: 2, projek: 'Pemasangan Penghawa Dingin Utama Dewan Solat', status: 'Sedang Berjalan' },
            { id: 3, projek: 'Mengecat Semula Bangunan Surau & Pagar', status: 'Selesai' }
          ])

          const [dataArkib, setDataArkib] = useState([
            { id: 1, tajuk: 'Program Ihya Ramadhan & Majlis Berbuka Puasa', tarikh: 'Mac 2026', urlGambar: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80' },
            { id: 2, tajuk: 'Gotong-Royong Perdana Pembersihan Surau', tarikh: 'Januari 2026', urlGambar: 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=600&q=80' }
          ])
          
          const [loading, setLoading] = useState(false)
          const [searchTerm, setSearchTerm] = useState('')
          
          const [isAdminMode, setIsAdminMode] = useState(false)
          const [isAuthorized, setIsAuthorized] = useState(false)
          const [passwordInput, setPasswordInput] = useState('')
          const ADMIN_PASSWORD = 'surau1234'

          const [editId, setEditId] = useState(null)
          const [formBaru, setFormBaru] = useState({
            tarikh: '',
            kategori: 'Mingguan',
            perkara: '',
            status: 'Aktif'
          })

          const [editPembangunanId, setEditPembangunanId] = useState(null)
          const [formPembangunan, setFormPembangunan] = useState({
            projek: '',
            status: 'Dalam Perancangan'
          })

          const [formArkib, setFormArkib] = useState({
            tajuk: '',
            tarikh: '',
            urlGambar: ''
          })

          const pengerusi = { jawatan: "Pengerusi", nama: "En. Awang Mohd Fauzi Bin Abu Samah" }
          const timbalanPengerusi = { jawatan: "Timbalan Pengerusi", nama: "En. Kamarul Bahrain Bin Salleh" }
          
          const barisanUrusetia = [
            { jawatan: "Setiausaha", nama: "En. Mansor Bin Mohamed" },
            { jawatan: "Penolong Setiausaha", nama: "En. Ismail Bin Ishak" },
            { jawatan: "Bendahari", nama: "En. Md Amin Bin Johan" }
          ]

          const senaraiAjk = [
            { nama: "En. Amiruddin Bin Othman" },
            { nama: "En. Abd Rashid Bin Tahir" },
            { nama: "En. Hj. Nazri Bin Abu Bakar" },
            { nama: "En. Hj. Yani Bin Selamat" },
            { nama: "En. Abd Jalil Bin Mansor" },
            { nama: "Pn. Rosnah Binti Salleh" },
            { nama: "En. Kamarulzaman Bin Hussin" },
            { nama: "Pn. Saamah Binti Shahar" },
            { nama: "Pn. Rosni Binti Mokhtar" },
            { nama: "En. Zahidi Bin Zakaria" }
          ]

          const pemeriksaKiraKira = [
            { nama: "En. Abd Jalil Bin Hassan" },
            { nama: "En. Mohd Asrul Effandy Bin Umar" }
          ]

          const pengerusiKhairat = { jawatan: "Pengerusi", nama: "En. Awang Mohd Fauzi Bin Abu Samah" }
          const naibPengerusiKhairat = { jawatan: "Naib Pengerusi", nama: "En. Fadzil Bin Sulaiman" }
          
          const urusetiaKhairat = [
            { jawatan: "Setiausaha", nama: "En. Ismail Bin Ishak" },
            { jawatan: "Bendahari", nama: "En. Mohd Zan Bin Mohd Nor" }
          ]

          const ajkKhairat = [
            { nama: "En. Amiruddin Bin Othman" },
            { nama: "En. Hj. Nazri Bin Abu Bakar" },
            { nama: "Pn. Suraya Binti Unan" },
            { nama: "Pn. Rosni Binti Mokhtar" },
            { nama: "En. Norman Bin Zainal" }
          ]

          const penasihatKhairat = [
            { nama: "En. Baharudin Bin Budin" },
            { nama: "En. Ismail Bin Jaamat" },
            { nama: "En. Karim Bin Ramalan" },
            { nama: "En. Abu Bakar Bin Wahab" },
            { nama: "En. Mustafa Bin Baharum" }
          ]

          useEffect(() => {
            if (supabase) {
              fetchSurauData()
            }
          }, [])

          async function fetchSurauData() {
            if (!supabase) return;
            try {
              setLoading(true)
              const { data, error } = await supabase.from('surau_management').select('*')
              if (!error && data && data.length > 0) {
                setDataSurau(data)
              }
            } catch (error) {
              console.error('Ralat sistem:', error)
            } finally {
              setLoading(false)
            }
          }

          function handleLoginAdmin(e) {
            e.preventDefault()
            if (passwordInput === ADMIN_PASSWORD) {
              setIsAuthorized(true)
              setPasswordInput('')
            } else {
              alert('Kata laluan salah!')
              setPasswordInput('')
            }
          }

          async function handleSimpanAktiviti(e) {
            e.preventDefault()
            if (!formBaru.tarikh || !formBaru.perkara) {
              alert('Sila lengkapkan ruangan Tarikh dan Perkara!')
              return
            }

            if (editId) {
              setDataSurau(dataSurau.map(item => item.id === editId ? { ...item, ...formBaru } : item))
              setEditId(null)
              alert('Program berjaya dikemaskini!')
            } else {
              const newItem = { id: Date.now(), ...formBaru }
              setDataSurau([newItem, ...dataSurau])
              alert('Program baru berjaya ditambah!')
            }

            setFormBaru({ tarikh: '', kategori: 'Mingguan', perkara: '', status: 'Aktif' })
          }

          async function handleSimpanPembangunan(e) {
            e.preventDefault()
            if (!formPembangunan.projek) {
              alert('Sila lengkapkan nama projek pembangunan!')
              return
            }

            if (editPembangunanId) {
              setDataPembangunan(dataPembangunan.map(item => item.id === editPembangunanId ? { ...item, ...formPembangunan } : item))
              setEditPembangunanId(null)
              alert('Projek pembangunan berjaya dikemaskini!')
            } else {
              const newProjek = { id: Date.now(), ...formPembangunan }
              setDataPembangunan([newProjek, ...dataPembangunan])
              alert('Projek pembangunan baru berjaya ditambah!')
            }

            setFormPembangunan({ projek: '', status: 'Dalam Perancangan' })
          }

          function handleImageChange(e) {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => {
                setFormArkib({ ...formArkib, urlGambar: reader.result });
              };
              reader.readAsDataURL(file);
            }
          }

          function handleSimpanArkib(e) {
            e.preventDefault()
            if (!formArkib.tajuk || !formArkib.urlGambar) {
              alert('Sila masukkan Tajuk Program dan Pilih Gambar!')
              return
            }

            const gambarBaru = { id: Date.now(), ...formArkib }
            setDataArkib([gambarBaru, ...dataArkib])
            alert('Gambar arkib berjaya dimuat naik!')
            setFormArkib({ tajuk: '', tarikh: '', urlGambar: '' })
          }

          function padamArkib(id) {
            if (window.confirm('Adakah anda pasti mahu memadam gambar arkib ini?')) {
              setDataArkib(dataArkib.filter(item => item.id !== id))
              alert('Gambar telah dipadam.')
            }
          }

          function mulaEditPembangunan(item) {
            setEditPembangunanId(item.id)
            setFormPembangunan({
              projek: item.projek || '',
              status: item.status || 'Dalam Perancangan'
            })
            window.scrollTo({ top: 0, behavior: 'smooth' })
          }

          function padamPembangunan(id) {
            if (window.confirm('Adakah anda pasti mahu memadam projek pembangunan ini?')) {
              setDataPembangunan(dataPembangunan.filter(item => item.id !== id))
              alert('Projek telah dipadam.')
            }
          }

          function mulaEdit(item) {
            setEditId(item.id)
            setFormBaru({
              tarikh: item.tarikh || '',
              kategori: item.kategori || 'Mingguan',
              perkara: item.perkara || '',
              status: item.status || 'Aktif'
            })
            window.scrollTo({ top: 0, behavior: 'smooth' })
          }

          function padamAktiviti(id) {
            if (window.confirm('Adakah anda pasti mahu memadam rekod program ini?')) {
              setDataSurau(dataSurau.filter(item => item.id !== id))
              alert('Rekod telah dipadam.')
            }
          }

          const filteredData = dataSurau
            .filter((item) => {
              const matchSearch = 
                item.perkara?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                item.tarikh?.toLowerCase().includes(searchTerm.toLowerCase())
              
              const matchKategori = item.kategori === subAktivitiTab;
              return matchSearch && matchKategori
            })
            .sort((a, b) => (a.tarikh > b.tarikh ? 1 : -1));

          return (
            <div style={{ minHeight: '100vh', backgroundColor: '#f8f9fa', fontFamily: 'Segoe UI, Tahoma, Geneva, Verdana, sans-serif', paddingBottom: '40px' }}>
              
              <header style={{ backgroundColor: '#1b4d3e', color: 'white', padding: '30px 20px', textAlign: 'center', boxShadow: '0 4px 6px rgba(0,0,0,0.1)', position: 'relative' }}>
                <button 
                  onClick={() => {
                    setIsAdminMode(!isAdminMode)
                    if (isAdminMode) {
                      setIsAuthorized(false)
                      setEditId(null)
                      setEditPembangunanId(null)
                    }
                  }}
                  style={{ position: 'absolute', top: '15px', right: '20px', background: isAdminMode ? '#c82333' : '#ffc107', color: isAdminMode ? 'white' : '#333', border: 'none', padding: '6px 12px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold' }}
                >
                  {isAdminMode ? 'Tutup Panel Admin' : '⚙️ Mod Admin'}
                </button>

                <h1 style={{ margin: '0 0 10px 0', fontSize: '26px' }}>🕌 Portal Rasmi Surau Al Falah</h1>
                <p style={{ margin: '0 0 5px 0', fontSize: '16px', fontWeight: '600', color: '#ffc107' }}>Taman Seri Chinchin, Jasin, Melaka</p>
                <p style={{ margin: 0, fontSize: '14px', color: '#d1e7dd' }}>Sistem Pengurusan Aktiviti, Pentadbiran & Maklumat Kariah</p>
              </header>

              <nav style={{ backgroundColor: '#14382c', display: 'flex', justifyContent: 'center', gap: '6px', padding: '10px 15px', boxShadow: 'inset 0 -2px 5px rgba(0,0,0,0.1)', flexWrap: 'wrap' }}>
                <button onClick={() => setActiveTab('aktiviti')} style={{ backgroundColor: activeTab === 'aktiviti' ? '#2e7d32' : 'transparent', color: 'white', border: 'none', padding: '10px 14px', borderRadius: '5px', cursor: 'pointer', fontWeight: '600', fontSize: '13px' }}>📋 Program</button>
                <button onClick={() => setActiveTab('arkib')} style={{ backgroundColor: activeTab === 'arkib' ? '#2e7d32' : 'transparent', color: 'white', border: 'none', padding: '10px 14px', borderRadius: '5px', cursor: 'pointer', fontWeight: '600', fontSize: '13px' }}>📸 Arkib</button>
                <button onClick={() => setActiveTab('carta')} style={{ backgroundColor: activeTab === 'carta' ? '#2e7d32' : 'transparent', color: 'white', border: 'none', padding: '10px 14px', borderRadius: '5px', cursor: 'pointer', fontWeight: '600', fontSize: '13px' }}>👥 Carta AJK</button>
                <button onClick={() => setActiveTab('khairat')} style={{ backgroundColor: activeTab === 'khairat' ? '#2e7d32' : 'transparent', color: 'white', border: 'none', padding: '10px 14px', borderRadius: '5px', cursor: 'pointer', fontWeight: '600', fontSize: '13px' }}>⚱️ Khairat</button>
                <button onClick={() => setActiveTab('pembangunan')} style={{ backgroundColor: activeTab === 'pembangunan' ? '#2e7d32' : 'transparent', color: 'white', border: 'none', padding: '10px 14px', borderRadius: '5px', cursor: 'pointer', fontWeight: '600', fontSize: '13px' }}>🏗️ Pembangunan</button>
                <button onClick={() => setActiveTab('sumbangan')} style={{ backgroundColor: activeTab === 'sumbangan' ? '#2e7d32' : 'transparent', color: 'white', border: 'none', padding: '10px 14px', borderRadius: '5px', cursor: 'pointer', fontWeight: '600', fontSize: '13px' }}>💰 Sumbangan</button>
              </nav>

              <main style={{ maxWidth: '1000px', margin: '30px auto', padding: '0 20px' }}>
                
                {isAdminMode && !isAuthorized && (
                  <div style={{ backgroundColor: '#fff3cd', border: '1px solid #ffeeba', padding: '25px', borderRadius: '8px', marginBottom: '25px', textAlign: 'center' }}>
                    <h3 style={{ margin: '0 0 10px 0', color: '#856404', fontSize: '18px' }}>🔐 Log Masuk Panel Admin</h3>
                    <form onSubmit={handleLoginAdmin} style={{ display: 'flex', justifyContent: 'center', gap: '10px', maxWidth: '350px', margin: '0 auto' }}>
                      <input 
                        type="password" 
                        placeholder="Kata laluan..." 
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        style={{ padding: '8px 12px', borderRadius: '4px', border: '1px solid #ced4da', flex: 1, fontSize: '14px' }}
                      />
                      <button type="submit" style={{ backgroundColor: '#1b4d3e', color: 'white', border: 'none', padding: '8px 15px', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer' }}>Masuk</button>
                    </form>
                  </div>
                )}

                {isAdminMode && isAuthorized && activeTab === 'aktiviti' && (
                  <div style={{ backgroundColor: editId ? '#e2e3e5' : '#d4edda', border: '1px solid', borderColor: editId ? '#d6d8db' : '#c3e6cb', padding: '20px', borderRadius: '8px', marginBottom: '25px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                      <h3 style={{ margin: 0, color: editId ? '#383d41' : '#155724', fontSize: '18px' }}>
                        {editId ? '✏️ Kemaskini Program' : '🛠️ Tambah Program Baru'}
                      </h3>
                      <button onClick={() => setIsAuthorized(false)} style={{ background: 'none', border: 'none', color: '#721c24', fontSize: '12px', cursor: 'pointer', textDecoration: 'underline' }}>Log Keluar Admin</button>
                    </div>

                    <form onSubmit={handleSimpanAktiviti} style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '15px' }}>
                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '5px' }}>Jadual / Hari / Tarikh:</label>
                        <input 
                          type="text" 
                          placeholder="cth: Setiap Malam Jumaat"
                          value={formBaru.tarikh} 
                          onChange={(e) => setFormBaru({ ...formBaru, tarikh: e.target.value })}
                          style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #ced4da', backgroundColor: 'white' }}
                        />
                      </div>

                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '5px' }}>Kategori Program:</label>
                        <select 
                          value={formBaru.kategori} 
                          onChange={(e) => setFormBaru({ ...formBaru, kategori: e.target.value })}
                          style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #ced4da', backgroundColor: 'white' }}
                        >
                          <option value="Mingguan">Mingguan</option>
                          <option value="Bulanan">Bulanan</option>
                          <option value="Tahunan">Tahunan</option>
                        </select>
                      </div>

                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '5px' }}>Perkara / Keterangan:</label>
                        <input 
                          type="text" 
                          placeholder="cth: Kuliah Dhuha"
                          value={formBaru.perkara} 
                          onChange={(e) => setFormBaru({ ...formBaru, perkara: e.target.value })}
                          style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #ced4da', backgroundColor: 'white' }}
                        />
                      </div>

                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '5px' }}>Status:</label>
                        <select 
                          value={formBaru.status} 
                          onChange={(e) => setFormBaru({ ...formBaru, status: e.target.value })}
                          style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #ced4da', backgroundColor: 'white' }}
                        >
                          <option value="Aktif">Aktif</option>
                          <option value="Dalam Proses">Dalam Proses</option>
                          <option value="Selesai">Selesai</option>
                        </select>
                      </div>

                      <div style={{ gridColumn: '1 / -1', textAlign: 'right' }}>
                        {editId && (
                          <button type="button" onClick={() => { setEditId(null); setFormBaru({ tarikh: '', kategori: 'Mingguan', perkara: '', status: 'Aktif' }) }} style={{ background: '#6c757d', color: 'white', border: 'none', padding: '10px 15px', borderRadius: '5px', marginRight: '10px', cursor: 'pointer' }}>Batal</button>
                        )}
                        <button type="submit" style={{ backgroundColor: editId ? '#ffc107' : '#28a745', color: editId ? '#333' : 'white', border: 'none', padding: '10px 20px', borderRadius: '5px', fontWeight: 'bold', cursor: 'pointer' }}>
                          💾 Simpan Rekod
                        </button>
                      </div>
                    </form>
                  </div>
                )}

                {/* BORANG ADMIN PILIH FAIL GAMBAR TERUS */}
                {isAdminMode && isAuthorized && activeTab === 'arkib' && (
                  <div style={{ backgroundColor: '#d4edda', border: '1px solid #c3e6cb', padding: '20px', borderRadius: '8px', marginBottom: '25px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                      <h3 style={{ margin: 0, color: '#155724', fontSize: '18px' }}>📸 Upload Gambar Program Terus</h3>
                      <button onClick={() => setIsAuthorized(false)} style={{ background: 'none', border: 'none', color: '#721c24', fontSize: '12px', cursor: 'pointer', textDecoration: 'underline' }}>Log Keluar Admin</button>
                    </div>

                    <form onSubmit={handleSimpanArkib} style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '15px' }}>
                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '5px' }}>Tajuk Program / Aktiviti:</label>
                        <input 
                          type="text" 
                          placeholder="cth: Majlis Maulidur Rasul"
                          value={formArkib.tajuk} 
                          onChange={(e) => setFormArkib({ ...formArkib, tajuk: e.target.value })}
                          style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #ced4da', backgroundColor: 'white' }}
                        />
                      </div>

                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '5px' }}>Tarikh / Bulan:</label>
                        <input 
                          type="text" 
                          placeholder="cth: Mac 2026"
                          value={formArkib.tarikh} 
                          onChange={(e) => setFormArkib({ ...formArkib, tarikh: e.target.value })}
                          style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #ced4da', backgroundColor: 'white' }}
                        />
                      </div>

                      <div style={{ gridColumn: '1 / -1' }}>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '5px' }}>Pilih Fail Gambar:</label>
                        <input 
                          type="file" 
                          accept="image/*"
                          onChange={handleImageChange}
                          style={{ width: '100%', padding: '6px', borderRadius: '4px', border: '1px solid #ced4da', backgroundColor: 'white' }}
                        />
                      </div>

                      <div style={{ gridColumn: '1 / -1', textAlign: 'right' }}>
                        <button type="submit" style={{ backgroundColor: '#28a745', color: 'white', border: 'none', padding: '10px 20px', borderRadius: '5px', fontWeight: 'bold', cursor: 'pointer' }}>
                          💾 Simpan & Masukkan ke Arkib
                        </button>
                      </div>
                    </form>
                  </div>
                )}

                {isAdminMode && isAuthorized && activeTab === 'pembangunan' && (
                  <div style={{ backgroundColor: editPembangunanId ? '#e2e3e5' : '#d4edda', border: '1px solid', borderColor: editPembangunanId ? '#d6d8db' : '#c3e6cb', padding: '20px', borderRadius: '8px', marginBottom: '25px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                      <h3 style={{ margin: 0, color: editPembangunanId ? '#383d41' : '#155724', fontSize: '18px' }}>
                        {editPembangunanId ? '✏️ Kemaskini Projek Pembangunan' : '🛠️ Tambah Projek Pembangunan Baru'}
                      </h3>
                      <button onClick={() => setIsAuthorized(false)} style={{ background: 'none', border: 'none', color: '#721c24', fontSize: '12px', cursor: 'pointer', textDecoration: 'underline' }}>Log Keluar Admin</button>
                    </div>

                    <form onSubmit={handleSimpanPembangunan} style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '15px' }}>
                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '5px' }}>Projek / Perkara:</label>
                        <input 
                          type="text" 
                          placeholder="cth: Naik taraf tandas..."
                          value={formPembangunan.projek}
